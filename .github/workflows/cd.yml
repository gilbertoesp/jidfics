name: CD - Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify Vercel secrets
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Missing repo secret VERCEL_TOKEN"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Missing repo secrets VERCEL_ORG_ID / VERCEL_PROJECT_ID"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link project (non-interactive)
        run: vercel link --yes --non-interactive --team "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --non-interactive

      - name: Build Project Artifacts
        run: vercel build

      - name: Deploy to Vercel Preview
        run: |
          url=$(vercel deploy --prebuilt --non-interactive)
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment ready: ${{ env.PREVIEW_URL }}'
            })

  deploy-production:
    name: Deploy Production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify Vercel secrets
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Missing repo secret VERCEL_TOKEN"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Missing repo secrets VERCEL_ORG_ID / VERCEL_PROJECT_ID"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link project (non-interactive)
        run: vercel link --yes --non-interactive --team "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --non-interactive

      - name: Build Project Artifacts
        run: vercel build --prod

      - name: Deploy to Vercel Production
        run: |
          url=$(vercel deploy --prebuilt --prod --non-interactive)
          echo "PRODUCTION_URL=$url" >> "$GITHUB_ENV"

      - name: Notify Production Deployment
        run: |
          echo "✅ Production deployment successful: ${{ env.PRODUCTION_URL }}"
